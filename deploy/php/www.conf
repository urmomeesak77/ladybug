; php-fpm pool sized for a 1 vCPU / 960 MiB box already hosting MySQL, two nginx
; instances and the Thousand game.
[www]
listen = 9000

; ondemand, not dynamic: idle workers are reaped, so a quiet site costs one master
; process rather than a permanently resident pool.
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 30s
; Recycle workers periodically so a slow leak in the image pipeline cannot accumulate.
pm.max_requests = 500

; Hard wall-clock ceiling per request. php.ini's max_execution_time=60 does NOT bound
; this: on Linux it counts the worker's own CPU time only, so time spent waiting on MySQL,
; on SMTP, or on a convert/ffmpeg/gifsicle child process is not counted at all. Without
; this, ladybug-web's fastcgi_read_timeout (60s) answers the visitor 504 and the worker
; carries on regardless, still holding one of the three slots above. 70s sits just past
; nginx's 60s so a request that would have finished in time is never cut short by
; this, and the worker is reclaimed shortly after nginx has given up on it.
request_terminate_timeout = 70s

; ImageMagick 7.1.1 ignores the time limit in its policy.xml (measured -- see
; deploy/php/imagemagick-policy.xml) but honours this variable. The Dockerfile sets it
; with ENV, but php-fpm clears the environment of its workers (clear_env = yes), so it
; is passed through explicitly or `convert` would run without it.
env[MAGICK_TIME_LIMIT] = 60

; Send worker stdout/stderr to the container log instead of swallowing it.
catch_workers_output = yes
decorate_workers_output = no
