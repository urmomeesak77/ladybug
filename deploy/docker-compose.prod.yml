# Production stack for online-trash.com, deployed to /web/online-trash.com/ on the
# Zone.eu VPS. Nothing is BUILT here -- images come from GHCR and the server only pulls
# (1 vCPU / 960 MiB). Compare docker-compose.yml, which is dev-only and says so.
#
# Service names are load-bearing: deploy/web/default.conf does `fastcgi_pass
# ladybug-php:9000` and backend.env sets DB_HOST=ladybug-mysql.
services:
  ladybug-mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: trashdb
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?must be set in .env}
      # First init also creates this non-root user with privileges on trashdb ONLY.
      # The application connects as this user; root exists for dumps and admin.
      MYSQL_USER: ladybug
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?must be set in .env}
    # NOTE: like the dev compose, these apply only when initialising an EMPTY datadir.
    # Changing them against an existing ./data/mysql updates the container environment
    # but NOT the server, and auth then breaks. Use ALTER USER on a live server instead.
    #
    # Tuned for a 960 MiB box shared with php-fpm, two nginx instances and Thousand.
    command:
      - --innodb-buffer-pool-size=96M
      - --performance-schema=OFF
      - --max-connections=30
      - --table-open-cache=200
      - --table-definition-cache=200
    # Published on a loopback address ONLY, so the port exists at a fixed address that
    # survives the container recreation every ./deploy.sh performs -- unlike the
    # container's network IP, which comes from the pool and changes on every recreate.
    # Reach it by tunnelling, never directly:
    #     ssh -L 3307:127.0.0.122:3306 root@online-trash.com
    # Binding to 127.0.0.122 scopes Docker's DNAT rule to that /32, so the port is
    # reachable only from the server itself; the whole 127/8 range is on `lo`, so any
    # address in it is bindable without configuring an interface. Do NOT change this to
    # 0.0.0.0 or a bare 3306: Docker's rules are inserted ahead of ufw, so a wildcard
    # publish would expose MySQL to the internet regardless of the firewall.
    ports:
      - "127.0.0.122:3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      # No -p: mysqladmin ping exits 0 whenever the server is up, even on Access denied,
      # so a password would only leak into `docker inspect`. Same rationale as dev.
      test: ["CMD", "mysqladmin", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ladybug-php:
    image: ghcr.io/urmomeesak77/ladybug-php:${LADYBUG_TAG:-latest}
    restart: unless-stopped
    volumes:
      # Mounted at run time, never baked: the image is public on GHCR.
      - ./backend.env:/var/www/html/.env:ro
      - ./data/storage:/var/www/html/storage
    depends_on:
      ladybug-mysql:
        condition: service_healthy

  # Drives Laravel's own scheduler (023): ladybug-php runs php-fpm as PID 1 and nothing
  # else in this stack calls schedule:run, so without this service the daily
  # access-log:prune entry in routes/console.php is dead code and the history grows
  # unbounded. FR-027a rules out solving it with a host crontab. It is the SAME image and
  # the same LADYBUG_TAG as ladybug-php -- one more container off one image, not a new
  # dependency -- and it sleeps between minutes, so idle cost on the 960 MiB box is small.
  # Same backend.env mount deliberately: a scheduler configured differently from the app
  # it prunes for would be a quiet way to delete the wrong rows.
  ladybug-scheduler:
    image: ghcr.io/urmomeesak77/ladybug-php:${LADYBUG_TAG:-latest}
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./backend.env:/var/www/html/.env:ro
      - ./data/storage:/var/www/html/storage
    depends_on:
      ladybug-mysql:
        condition: service_healthy

  ladybug-web:
    image: ghcr.io/urmomeesak77/ladybug-web:${LADYBUG_TAG:-latest}
    restart: unless-stopped
    # No published port at all. The edge reaches this container by name over the
    # shared network below. A loopback publish is unreachable from the edge
    # (DNAT-scoped to 127.0.0.1/32, while host-gateway is the docker0 address),
    # and publishing on 0.0.0.0 would be world-reachable over plain HTTP because
    # Docker's port rules bypass ufw.
    networks:
      - default
      - edge
    volumes:
      - ./data/storage/app/public:/srv/media:ro
    depends_on:
      - ladybug-php

# ladybug-mysql, ladybug-php and ladybug-scheduler stay on `default` only (declared
# implicitly, not listed above) -- none is attached to `edge`, so the database, the app
# server and the scheduler all stay unreachable from the shared edge network. Only
# ladybug-web, which is meant to be reached from outside this stack, joins it.
networks:
  edge:
    external: true
    name: nginx_default
