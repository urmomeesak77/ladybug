# Production stack for online-trash.com, deployed to /web/online-trash.com/ on the
# Zone.eu VPS. Nothing is BUILT here -- images come from GHCR and the server only pulls
# (1 vCPU / 960 MiB). Compare docker-compose.yml, which is dev-only and says so.
#
# Service names are load-bearing: deploy/web/default.conf does `fastcgi_pass
# ladybug-php:9000` and backend.env sets DB_HOST=ladybug-mysql.
#
# MEMORY CEILINGS (mem_limit). Without them every container shares the host's 960 MiB
# with no boundary, and when it runs out the KERNEL's OOM killer picks the victim by
# size -- which is mysqld, the one process whose death corrupts nothing but takes the
# whole site down and is slowest to come back. php is the dangerous neighbour: three
# fpm workers x memory_limit=256M is already 768M, and the convert / ffmpeg / gifsicle
# children they spawn are separate processes that memory_limit does not bound at all.
# A cgroup limit turns that into a LOCAL OOM: the kernel kills the largest process
# inside the offending container (a worker or its convert child), php-fpm respawns the
# worker, and mysqld is never in the frame.
#
# The arithmetic, against the steady-state budget in docs/DEPLOYMENT.md Section 10:
#     host 960 MiB - OS+dockerd ~250 - edge nginx + Thousand ~95  = ~615 MiB for Ladybug
#     steady state: mysql ~280 + php ~150 + web ~15 + scheduler ~40 + queue ~45 = ~530 MiB
# The limits below are CEILINGS for a spike, not reservations, so they deliberately sum
# past 615 (mysql 384 + php 450 + queue 384 + scheduler 192 + web 64 = 1474 MiB): they never fire
# in steady state, and what they guarantee is that one container's spike is paid for by
# that container. The 2 GiB host swap (setup.sh) absorbs the overlap -- with no
# memswap_limit, each container may additionally swap up to its own mem_limit, so a
# spike degrades into slowness before anything is killed.
#   - mysql 384m: InnoDB buffer pool 96M + per-connection buffers for max_connections=30
#     + server overhead; measured ~280 MiB, so ~100 MiB of headroom. It must NEVER be the
#     container that hits its limit -- if `docker stats` shows it near 384, raise this
#     before anything else.
#   - php 450m: since 024 the request workers no longer decode media -- an upload is
#     only written to staging -- so the pool's memory_limit drops to 192M (www.conf).
#     The heaviest thing left here is the OG-image transcode: one GD decode of a variant
#     at most 1200 px wide, cached after the first request per post, so two workers
#     doing it at once is the realistic worst case.
#   - queue 384m: the ONE process that now decodes media. One job at a time: up to the
#     256M CLI memory_limit (a 25 MP decode + scaled copy is ~180M) plus its convert /
#     ffmpeg / gifsicle child, which memory_limit does not bound but the per-call Process
#     timeouts and the ImageMagick policy do. Moving the decode here, single-file, is what
#     paid for it: the worst case used to be three fpm workers decoding at once.
#   - scheduler 192m: `schedule:work` forks one artisan process a minute; the daily
#     access-log:prune is a chunked DELETE, not a load into memory.
#   - web 64m: nginx serving static files; ~15 MiB measured.
services:
  ladybug-mysql:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 384m   # see MEMORY CEILINGS at the top
    environment:
      MYSQL_DATABASE: trashdb
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?must be set in .env}
      # First init also creates this non-root user with privileges on trashdb ONLY.
      # The application connects as this user; root exists for dumps and admin.
      MYSQL_USER: ladybug
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?must be set in .env}
    # NOTE: like the dev compose, these apply only when initialising an EMPTY datadir.
    # Changing them against an existing ./data/mysql updates the container environment
    # but NOT the server, and auth then breaks. Use ALTER USER on a live server instead.
    #
    # Tuned for a 960 MiB box shared with php-fpm, two nginx instances and Thousand.
    command:
      - --innodb-buffer-pool-size=96M
      - --performance-schema=OFF
      - --max-connections=30
      - --table-open-cache=200
      - --table-definition-cache=200
    # Published on a loopback address ONLY, so the port exists at a fixed address that
    # survives the container recreation every ./deploy.sh performs -- unlike the
    # container's network IP, which comes from the pool and changes on every recreate.
    # Reach it by tunnelling, never directly:
    #     ssh -L 3307:127.0.0.122:3306 root@online-trash.com
    # Binding to 127.0.0.122 scopes Docker's DNAT rule to that /32, so the port is
    # reachable only from the server itself; the whole 127/8 range is on `lo`, so any
    # address in it is bindable without configuring an interface. Do NOT change this to
    # 0.0.0.0 or a bare 3306: Docker's rules are inserted ahead of ufw, so a wildcard
    # publish would expose MySQL to the internet regardless of the firewall.
    ports:
      - "127.0.0.122:3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      # No -p: mysqladmin ping exits 0 whenever the server is up, even on Access denied,
      # so a password would only leak into `docker inspect`. Same rationale as dev.
      test: ["CMD", "mysqladmin", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ladybug-php:
    image: ghcr.io/urmomeesak77/ladybug-php:${LADYBUG_TAG:-latest}
    restart: unless-stopped
    mem_limit: 450m   # see MEMORY CEILINGS at the top
    volumes:
      # Mounted at run time, never baked: the image is public on GHCR.
      - ./backend.env:/var/www/html/.env:ro
      - ./data/storage:/var/www/html/storage
    depends_on:
      ladybug-mysql:
        condition: service_healthy

  # Drives Laravel's own scheduler (023): ladybug-php runs php-fpm as PID 1 and nothing
  # else in this stack calls schedule:run, so without this service the daily
  # access-log:prune entry in routes/console.php is dead code and the history grows
  # unbounded. FR-027a rules out solving it with a host crontab. It is the SAME image and
  # the same LADYBUG_TAG as ladybug-php -- one more container off one image, not a new
  # dependency -- and it sleeps between minutes, so idle cost on the 960 MiB box is small.
  # Same backend.env mount deliberately: a scheduler configured differently from the app
  # it prunes for would be a quiet way to delete the wrong rows.
  ladybug-scheduler:
    image: ghcr.io/urmomeesak77/ladybug-php:${LADYBUG_TAG:-latest}
    restart: unless-stopped
    mem_limit: 192m   # see MEMORY CEILINGS at the top
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./backend.env:/var/www/html/.env:ro
      - ./data/storage:/var/www/html/storage
    depends_on:
      ladybug-mysql:
        condition: service_healthy

  # Runs the queued work (024): upload processing, mail, YouTube stills. Without it an
  # upload stays `processing` (never public) and no verification or recovery mail is sent,
  # so deploy.sh's summary checks that this container is up. Same image, same LADYBUG_TAG,
  # same backend.env and storage as ladybug-php -- the request writes the staged upload,
  # this container reads it. --max-jobs/--max-time recycle the process and --memory makes
  # it exit cleanly on heap growth; restart: brings it back either way. stop_grace_period
  # outlasts the 180 s job timeout, so a deploy's recreate lets an in-flight job finish
  # instead of killing it mid-write (a killed job is re-delivered after retry_after anyway).
  ladybug-queue:
    image: ghcr.io/urmomeesak77/ladybug-php:${LADYBUG_TAG:-latest}
    restart: unless-stopped
    mem_limit: 384m   # see MEMORY CEILINGS at the top
    stop_grace_period: 200s
    command: ["php", "artisan", "queue:work", "database", "--sleep=3", "--tries=1", "--timeout=180", "--max-jobs=200", "--max-time=3600", "--memory=256"]
    volumes:
      - ./backend.env:/var/www/html/.env:ro
      - ./data/storage:/var/www/html/storage
    depends_on:
      ladybug-mysql:
        condition: service_healthy

  ladybug-web:
    image: ghcr.io/urmomeesak77/ladybug-web:${LADYBUG_TAG:-latest}
    restart: unless-stopped
    mem_limit: 64m    # see MEMORY CEILINGS at the top
    # No published port at all. The edge reaches this container by name over the
    # shared network below. A loopback publish is unreachable from the edge
    # (DNAT-scoped to 127.0.0.1/32, while host-gateway is the docker0 address),
    # and publishing on 0.0.0.0 would be world-reachable over plain HTTP because
    # Docker's port rules bypass ufw.
    networks:
      - default
      - edge
    volumes:
      - ./data/storage/app/public:/srv/media:ro
    depends_on:
      - ladybug-php

# ladybug-mysql, ladybug-php, ladybug-scheduler and ladybug-queue stay on `default` only
# (declared implicitly, not listed above) -- none is attached to `edge`, so the database,
# the app server and both workers all stay unreachable from the shared edge network. Only
# ladybug-web, which is meant to be reached from outside this stack, joins it.
networks:
  edge:
    external: true
    name: nginx_default
