# The Ladybug stack's own nginx: serves the built SPA, serves media straight off the
# storage bind mount, and forwards the application routes to php-fpm. The shared edge
# nginx proxies to this and needs to know nothing about Ladybug's paths.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    # NO `index` directive, deliberately -- see `location = /` below.

    # The edge caps this too; repeated so the limit holds however the stack is reached.
    # 10 MiB image cap (CreatePostRequest) plus multipart overhead.
    client_max_body_size 12M;

    # Transfer compression for text responses. Repeated in nginx-edge/online-trash.com.conf
    # so the behaviour holds however the stack is reached.
    #
    # `gzip_proxied any` is load-bearing: every response this server produces is generated
    # for a request that arrived from the edge proxy, and the default (`off`) would skip
    # compression for exactly the traffic that matters.
    #
    # text/html is deliberately ABSENT from gzip_types -- `gzip on` already covers it
    # unconditionally, and nginx refuses to load a config that lists it a second time.
    # Image and video types are absent too, so /storage/ media is never re-compressed
    # (FR-031) -- it is already compressed and spending CPU on it would only grow it.
    #
    # comp_level 5 is near-level-9 ratio at a fraction of the CPU, which matters on a
    # 1 vCPU box shared with php-fpm, MySQL and two nginx instances.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/xml
                      application/xml+rss application/json image/svg+xml;

    # Media: served directly off the bind mount, never through PHP. Size variants are
    # content-addressed and never rewritten, so they are safe to mark immutable.
    # This is why `artisan storage:link` is irrelevant in production.
    location /storage/ {
        alias /srv/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Hashed Vite assets are immutable by construction.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application routes. /sanctum is required: the SPA fetches /sanctum/csrf-cookie
    # before every mutating request (frontend/src/lib/csrf.ts). /up is the framework
    # health route declared in bootstrap/app.php's withRouting(health:).
    location ~ ^/(api|up|sanctum)(/|$) {
        include fastcgi_params;
        # Resolve php-fpm per REQUEST, not at config load. A bare hostname makes
        # nginx refuse to START whenever ladybug-php is not yet resolvable -- which
        # happens on a host reboot, where Docker's daemon-triggered restarts do not
        # honour depends_on. With a variable upstream, nginx starts regardless and a
        # down backend degrades to a clean 502 instead of a dead web container.
        # 127.0.0.11 is Docker's embedded DNS, present on every Compose network.
        resolver 127.0.0.11 valid=10s;
        set $upstream ladybug-php;
        fastcgi_pass $upstream:9000;
        # SCRIPT_FILENAME is resolved inside the PHP container's own filesystem, so this
        # nginx never needs a copy of the application code.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 60s;
    }

    # The home feed needs its own exact-match location, and the reason is the least
    # obvious line in this file. For `GET /` the request URI is `/`, and a try_files
    # term ending in a slash is a DIRECTORY test -- `$uri` matches the document root
    # itself, so `try_files $uri @shell` would hand `/` to the index module and
    # answer with the static dist/index.html, never reaching Laravel. The home feed
    # would ship with today's empty <head> while every PHPUnit test passed, because
    # PHPUnit calls Laravel with no nginx in front of it. The unsatisfiable first
    # term forces the fallback; removing `index index.html;` from the server block
    # above is the other half of the same change, and removes the directive that
    # made the bug quiet. Both are verified against a real nginx build (T040b).
    location = / {
        try_files /__shell__ @shell;
    }

    # Every other path: a real file (assets, favicon, logos) is served statically,
    # and everything else -- client-side routes, /robots.txt, /sitemap.xml -- goes
    # to Laravel, which composes the <head> and picks the status code. Note there is
    # no `$uri/` term any more: a directory test here would resurrect the trap above
    # for any address that happens to name a directory.
    location / {
        try_files $uri @shell;
    }

    # Same fastcgi block as the /(api|up|sanctum) location, including the
    # resolver + variable upstream (which is what lets nginx start when php is not
    # yet resolvable -- see the comment there).
    location @shell {
        include fastcgi_params;
        resolver 127.0.0.11 valid=10s;
        set $upstream ladybug-php;
        fastcgi_pass $upstream:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 60s;
    }
}
