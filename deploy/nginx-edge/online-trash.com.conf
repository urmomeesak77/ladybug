# Apex and www for online-trash.com. Installed at /web/nginx/conf.d/ alongside
# default.conf, which keeps the games.online-trash.com blocks; the apex blocks are
# REMOVED from default.conf when this lands (see DEPLOYMENT.md).
#
# Unlike the Thousand game (which default.conf still reaches via a loopback-published
# port through the Docker host gateway, extra_hosts: host.docker.internal:host-gateway
# in /web/nginx/docker-compose.yml), the Ladybug stack publishes no port at all: this
# edge container joins ladybug-web's own Compose network (`nginx_default`, declared
# `external` in deploy/docker-compose.prod.yml) and reaches it BY CONTAINER NAME. A
# loopback publish is DNAT-scoped to 127.0.0.1/32 and is unreachable from a sibling
# container even via host-gateway -- this was measured broken on the real server.

server {
    listen 80;
    listen [::]:80;
    server_name online-trash.com www.online-trash.com;

    # certbot's http-01 challenge is fetched over plain HTTP. A bare `return` in the
    # server{} context runs during nginx's server-rewrite phase, which happens BEFORE
    # the find-config (location matching) phase -- so text order does not matter: a
    # server-level `return 301` here would fire unconditionally and this location
    # would never be reached. Putting the redirect inside `location /` instead defers
    # it to the find-config phase, where the more specific /.well-known/acme-challenge/
    # prefix wins over `/` and the token is actually served. This -- not comment order
    # -- is what was broken before and is why the redirect below is a location, not a
    # bare `return`.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://online-trash.com$request_uri;
    }
}

# www -> apex, so there is exactly one canonical origin. This matters beyond tidiness:
# SESSION_DOMAIN and SANCTUM_STATEFUL_DOMAINS are pinned, and a session started on one
# host would not be presented on the other.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.online-trash.com;

    ssl_certificate /etc/letsencrypt/live/online-trash.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/online-trash.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://online-trash.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name online-trash.com;

    ssl_certificate /etc/letsencrypt/live/online-trash.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/online-trash.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # includeSubDomains is deliberately omitted: games.online-trash.com is a sibling
    # on the same certificate but is not managed by this file, so we cannot assert
    # HSTS on its behalf here.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Must be the LOOSEST limit in the stack, not the tightest. The ladder is
    # CreatePostRequest's 20 MiB video cap (friendly, limit-naming 422) < php.ini's
    # upload_max_filesize=25M < post_max_size=26M (Laravel's ValidatePostSize 413)
    # < this. A 413 from nginx never reaches PHP, so it yields neither the friendly
    # message nor an access-log entry (023 FR-032). The previous 12M was sized for
    # the old 10 MiB image cap and was never revisited when 019 added video, which
    # made the advertised 20 MiB ceiling unreachable in production.
    client_max_body_size 28M;

    # Paired with the cap above, not independent of it. Raising the cap to 28M more than
    # doubled how long a slow-POST client can hold a connection open dribbling a body, and
    # the origin behind this runs php-fpm with pm.max_children = 3 (deploy/php/www.conf) on
    # a 1 vCPU box -- three such clients is the whole pool. nginx's default is 60s BETWEEN
    # successive reads, so a trickle of one byte a minute renews it forever; 20s still
    # clears any real upload (the body streams to nginx at link speed, not at PHP's pace)
    # while cutting the window a stalled sender can occupy. Only the two production configs
    # set this -- docker/nginx-{dev,e2e} are bound to localhost and face no such client.
    client_body_timeout 20s;
    client_header_timeout 20s;

    # The same gzip block deploy/web/default.conf carries, repeated so the behaviour holds
    # however the stack is reached. In the normal path the origin does the compressing --
    # nginx forwards the client's Accept-Encoding upstream, so a response arrives here
    # already gzipped and is passed straight through -- and this block covers anything the
    # edge answers itself or receives uncompressed. `gzip_proxied any` is what makes it
    # apply to proxied responses at all; the default (`off`) would skip all of them.
    #
    # text/html is deliberately ABSENT from gzip_types: `gzip on` covers it unconditionally
    # and nginx refuses to load a config that lists it a second time. Image and video types
    # are absent too, so meme media is never re-compressed (FR-031).
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/xml
                      application/xml+rss application/json image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Vulnerability scanners. In the eight days after the access log (023) went in,
    # 29,166 of the 31,412 requests the stack answered -- 93% -- were probes for a
    # PHP or WordPress file that has never existed here, and every one of them was
    # proxied down to Laravel to render a 404 nobody reads.
    #
    # No Ladybug address ends in .php or begins with /wp-: the SPA's client-side
    # routes, /api, /up, /sanctum, /robots.txt and the /sitemaps/*.xml children are
    # the entire surface, so this cannot shadow a real one. It cannot shadow the
    # acme-challenge prefix above either -- that path matches neither alternative.
    #
    # Repeated in deploy/web/default.conf for the same reason the body cap and the
    # gzip block are: the rule must hold however the stack is reached. Stopping the
    # probe here additionally saves the proxy hop into ladybug-web.
    location ~* (\.php$|^/wp-) {
        return 444;
    }

    location / {
        # Resolve ladybug-web per REQUEST, not at config load, and by container name
        # over the shared `nginx_default` network -- the same pattern deploy/web/default.conf
        # uses to reach ladybug-php, and for the same reason: a bare hostname makes nginx
        # refuse to START whenever ladybug-web is not yet resolvable (e.g. a host reboot,
        # where Docker's daemon-triggered restarts do not honour depends_on). 127.0.0.11 is
        # Docker's embedded DNS, present on every network this container is attached to.
        resolver 127.0.0.11 valid=10s;
        set $upstream ladybug-web;
        proxy_pass http://$upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Laravel reads this to build https URLs and to sign/validate e-mail
        # verification links. Requires trustProxies (backend/bootstrap/app.php).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
