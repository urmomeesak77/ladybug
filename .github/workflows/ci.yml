name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # No DB service or DB_* env: tests run on SQLite :memory: (forced by
    # phpunit.xml and enforced by Tests\TestCase). Injecting real DB_* env vars
    # here would override that force and run the suite against a real database.
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, mbstring, gd
          coverage: pcov
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # gifsicle: animated-GIF variant generation (App\Support\GifFile) — the unit
      # tests shell out to the real binary, same as the ladybug-php dev image.
      - name: Install gifsicle
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gifsicle

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Test with coverage
        run: php artisan test --coverage-clover=coverage.clover

      - name: Coverage gate (>=90%)
        run: python3 ../.github/scripts/check_coverage.py coverage.clover 90

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Test with coverage (>=90%)
        run: npx vitest run --coverage --coverage.thresholds.lines=90

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Before the stack boots: frontend-e2e's anonymous /app/node_modules volume
      # makes Docker create frontend/node_modules on the host as root, after which
      # a host npm ci hits EACCES. Installing first keeps the dir runner-owned.
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # backend-e2e bind-mounts ./backend and runs artisan straight off it, so the
      # checkout must carry vendor/ (locally the dev tree already has it). Same
      # install and cache key as the backend job, so this is usually a cache hit.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, mbstring, gd
          coverage: none
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      # Same seeding scripts/e2e.ps1 does locally: the committed template plus a
      # fresh APP_KEY. The file is mounted over /app/.env inside backend-e2e.
      - name: Seed backend/.env.e2e
        run: |
          key="base64:$(openssl rand -base64 32)"
          sed "s|^APP_KEY=$|APP_KEY=${key}|" backend/.env.e2e.example > backend/.env.e2e

      # The isolated, disposable stack (tmpfs MySQL, ports 5174/8001) — the same one
      # scripts/e2e.ps1 runs locally. There is no persistent database in this job.
      - name: Boot the isolated e2e stack
        run: docker compose -p ladybug-e2e -f docker-compose.e2e.yml up -d --build --wait

      # --wait only covers container health; the backend serves only after
      # migrate:fresh + seeding, and Vite only after its in-container npm install.
      # Poll both (cap ~3 min each) like the local script does.
      - name: Wait for the backend and the SPA
        run: |
          for url in http://localhost:8001/api/health http://localhost:5174; do
            ready=""
            for attempt in $(seq 1 90); do
              if curl -fsS -o /dev/null "$url"; then ready=1; break; fi
              sleep 2
            done
            if [ -z "$ready" ]; then
              echo "not ready: $url" >&2
              docker compose -p ladybug-e2e -f docker-compose.e2e.yml logs
              exit 1
            fi
          done

      - name: Run e2e specs
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5174
        run: npx playwright test

      # Evidence for spec failures the runner can't show us locally: what the API
      # actually returns from the runner, and what each container logged.
      - name: Diagnose on failure
        if: failure()
        run: |
          echo "=== GET /api/posts (as the SPA origin) ==="
          curl -sS -i -H "Origin: http://localhost:5174" http://localhost:8001/api/posts | head -c 4000 || true
          echo
          echo "=== compose logs ==="
          docker compose -p ladybug-e2e -f docker-compose.e2e.yml logs --no-color
          echo "=== laravel.log ==="
          tail -n 200 backend/storage/logs/laravel.log || true

      # error-context.md page snapshots per failed spec — shows what the page rendered.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore

      - name: Tear down the e2e stack
        if: always()
        run: docker compose -p ladybug-e2e -f docker-compose.e2e.yml down -v
