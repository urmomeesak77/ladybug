# Dev-only nginx: fronts the backend purely so /storage/ media is served with real
# HTTP Range support, matching production (deploy/web/default.conf's same location
# block). `php artisan serve`'s built-in static-file handling ignores Range headers
# entirely (always 200s the whole file), which leaves Chrome's video element with an
# empty `seekable` range forever -- even once the file is fully buffered -- so
# scrubbing silently resets to 0. Firefox tolerates the missing Range support, which
# is why the bug looked browser-specific. Everything else is a plain reverse proxy to
# `backend:8000` (php artisan serve), not fastcgi_pass -- dev has no php-fpm.
server {
    listen 80;
    server_name _;

    # Must be the LOOSEST limit in the stack, not the tightest. The ladder is
    # CreatePostRequest's 20 MiB video cap (friendly, limit-naming 422) < php.ini's
    # upload_max_filesize=25M < post_max_size=26M (Laravel's ValidatePostSize 413)
    # < this. nginx answers a 413 without ever reaching PHP, so anything it rejects
    # gets neither the friendly message nor an access-log entry (023 FR-032) --
    # which is exactly what 12M did here: sized for the old 10 MiB image cap, it
    # silently made the advertised 20 MiB video ceiling unreachable.
    client_max_body_size 28M;

    location /storage/ {
        alias /srv/media/;
        access_log off;
        # Dev-only CORS. In production the SPA and /storage/ are the SAME origin (one
        # server block in deploy/web/default.conf), but dev splits them across ports --
        # SPA on :5173, media here on :8000 -- so a cross-origin `fetch` of a media file
        # is blocked without this header. 021's animated-image probe reads the bytes with
        # fetch + ImageDecoder, so without it the canvas takeover silently never happens
        # in dev while working fine in prod. Wildcard is safe: this media is public and
        # the probe sends no credentials.
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
