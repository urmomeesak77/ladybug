; Dev-only upload limits. The stock php:8.3-cli image ships PHP's tiny defaults
; (upload_max_filesize=2M, post_max_size=8M) — far under CreatePostRequest's 20 MiB
; video cap (or even its pre-existing 10 MiB image cap), so a real-sized upload would
; be truncated by PHP before Laravel's own validation ever runs. Mirrors
; deploy/php/php.ini's production values (headroom above the 20 MiB app cap so
; CreatePostRequest's own `max:20480` rule -- not a generic PHP failure -- is what
; rejects a reasonably-oversized file, per SC-002).
upload_max_filesize=25M
post_max_size=26M
