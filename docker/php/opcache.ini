; Dev-only opcache tuning. `php artisan serve` runs under the CLI SAPI, so
; opcache must be enabled for CLI too (enable_cli). validate_timestamps=0 is the
; key setting: the backend (incl. vendor/) is bind-mounted from Windows, where
; per-request filesystem stat/open syscalls during autoload cost ~2s/request.
; With timestamp validation OFF, opcache serves cached bytecode straight from
; memory and never touches the bind mount — boot drops from ~2s to ~0.1s.
; Tradeoff: edited backend PHP is NOT picked up until opcache is reset, i.e.
; run `docker compose restart backend` after backend code changes.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
