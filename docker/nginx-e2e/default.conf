# E2E-only nginx, the isolated stack's counterpart to docker/nginx-dev/default.conf.
# Same two reasons that config exists, plus one specific to e2e:
#
#   1. Real HTTP Range support on /storage/ media (`php artisan serve` ignores Range
#      entirely), which the video specs need.
#   2. Access-Control-Allow-Origin on /storage/. In production the SPA and its media are
#      the SAME origin; the e2e stack splits them (SPA :5174, this :8001), so a
#      cross-origin `fetch` of a media file is blocked without the header. 021's
#      animated-image probe reads bytes with fetch + ImageDecoder, so without it the
#      canvas takeover silently never happens here while working fine in prod, and
#      animated-image.spec.ts would fail against a perfectly healthy application.
#      Wildcard is safe: this media is public and the probe sends no credentials.
#
# Everything else is a plain reverse proxy to `backend-e2e:8000` (php artisan serve),
# not fastcgi_pass -- the e2e stack has no php-fpm, exactly like dev.
server {
    listen 80;
    server_name _;

    client_max_body_size 12M;

    location /storage/ {
        alias /srv/media/;
        access_log off;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://backend-e2e:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
