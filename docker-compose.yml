# Development-only environment (FR-009): one command brings up the backend API, a
# MySQL 8.0 database, and the Vite dev server, all pinned to the versions CI uses
# (PHP 8.3 / MySQL 8.0 / Node 20, FR-008). This is NOT a production setup and CI
# does not depend on it.
#
# Durable dev data (MySQL datadir + media/storage tree) lives OUTSIDE the repo
# under a single host directory, LADYBUG_DATA_ROOT. It defaults to
# C:/docker_permanent (baked in below), so the stack runs with zero config; set
# LADYBUG_DATA_ROOT in a root .env file (see .env.example) to relocate all of it
# at once. Keep DB dumps in sync via the same var in scripts/backup-db.ps1.
#
# MySQL db name, root password, and host port are configurable via
# MYSQL_DATABASE / MYSQL_ROOT_PASSWORD / MYSQL_HOST_PORT (see .env.example);
# defaults reproduce the original trashdb / root / 4444 values. NOTE: the
# backend app reads its DB connection from backend/.env, a separate file --
# overriding the db name or password here means editing backend/.env to match.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trashdb}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      # Loopback-only: this is a root/root dev DB holding the real media library --
      # published on 0.0.0.0 it is open to anyone on the same network.
      - "127.0.0.1:${MYSQL_HOST_PORT:-4444}:3306" # host port (default 4444) -> container 3306
    volumes:
      # DB datadir on a host bind-mount OUTSIDE the repo (real NTFS), so the
      # database survives not just Docker teardown but also uninstalling Docker
      # entirely -- unlike a Docker-managed named volume, which lives inside the
      # WSL2 VM and is destroyed with it. See scripts/backup-db.ps1 for the
      # logical (.sql) dumps that back this up.
      - ${LADYBUG_DATA_ROOT:-C:/docker_permanent}/ladybug-mysql:/var/lib/mysql
    healthcheck:
      # No password: `mysqladmin ping` exits 0 whenever the server is up, even
      # on Access denied (per MySQL docs), so -p would only add an insecure-
      # password warning per probe and leak the password into `docker inspect`.
      test: ["CMD", "mysqladmin", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./docker/php
    image: ladybug-php
    working_dir: /app
    # Seed .env on first run, ensure an app key exists, then serve the API.
    command: >
      sh -c "[ -f .env ] || cp .env.example .env;
             grep -q '^APP_KEY=base64:' .env || php artisan key:generate;
             php artisan serve --host=0.0.0.0 --port=8000"
    # NO driver env vars here, on purpose. App config (DB_*, SESSION_DRIVER,
    # CACHE_STORE) lives in backend/.env: a real container env var overrides
    # phpunit.xml's <env> test config (even with force="true"), which once made
    # `php artisan test` run RefreshDatabase against the live dev DB and wipe
    # it, and later made throttle counters persist in the file cache across
    # test runs (CACHE_STORE=file beat the array store). Tests\TestCase guards
    # both. backend/.env uses file-backed session/cache drivers so the dev
    # server works without migrated sessions/cache tables.
    volumes:
      - ./backend:/app
      # Persist ALL Laravel storage (incl. the ~1.3 GB media library under
      # app/public) in a physical folder OUTSIDE the repo, so it survives not
      # just Docker teardown but also `git clean` / deleting the project dir.
      # This nested mount shadows the repo's storage skeleton inside /app.
      - ${LADYBUG_DATA_ROOT:-C:/docker_permanent}/ladybug-storage:/app/storage
      # The SPA shell Laravel injects its <head> into (config seo.shell_path).
      # In production the php image bakes the BUILT dist/index.html here; dev has
      # no build, so the unbuilt source shell stands in. Read-only: this is the
      # frontend's file and nothing in the backend may write to it. Browsing dev
      # still goes through Vite on :5173 and never touches this route -- the mount
      # exists so `curl http://localhost:8000/...` can verify the metadata, which
      # is the correct instrument anyway (the point is what happens without JS).
      - ./frontend/index.html:/app/resources/spa/index.html:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: node:20
    working_dir: /app
    # Anonymous volume below keeps the host's (Windows) node_modules out of the
    # Linux container; install fresh, then serve Vite on all interfaces.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
