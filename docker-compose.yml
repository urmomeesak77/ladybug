# Development-only environment (FR-009): one command brings up the backend API, a
# MySQL 8.0 database, and the Vite dev server, all pinned to the versions CI uses
# (PHP 8.3 / MySQL 8.0 / Node 20, FR-008). This is NOT a production setup and CI
# does not depend on it.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: trashdb
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "4444:3306" # host 4444 -> container 3306
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./docker/php
    image: ladybug-php
    working_dir: /app
    # Seed .env on first run, ensure an app key exists, then serve the API.
    command: >
      sh -c "[ -f .env ] || cp .env.example .env;
             grep -q '^APP_KEY=base64:' .env || php artisan key:generate;
             php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      # Target the MySQL service for DB work (migrations, app queries). Without
      # this the .env default (sqlite) wins and `artisan migrate` never reaches
      # trashdb. Sessions/cache stay file-backed (below), so the dev server runs
      # even when MySQL is down.
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: trashdb
      DB_USERNAME: root
      DB_PASSWORD: root
      # File-backed drivers keep the dev server working without running migrations.
      SESSION_DRIVER: file
      CACHE_STORE: file
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: node:20
    working_dir: /app
    # Anonymous volume below keeps the host's (Windows) node_modules out of the
    # Linux container; install fresh, then serve Vite on all interfaces.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql-data:
