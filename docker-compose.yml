# Development-only environment (FR-009): one command brings up the backend API, a
# MySQL 8.0 database, and the Vite dev server, all pinned to the versions CI uses
# (PHP 8.3 / MySQL 8.0 / Node 20, FR-008). This is NOT a production setup and CI
# does not depend on it.
#
# Durable dev data (MySQL datadir + media/storage tree) lives OUTSIDE the repo
# under a single host directory, LADYBUG_DATA_ROOT. It defaults to
# C:/docker_permanent (baked in below), so the stack runs with zero config; set
# LADYBUG_DATA_ROOT in a root .env file (see .env.example) to relocate all of it
# at once. Keep DB dumps in sync via the same var in scripts/backup-db.ps1.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: trashdb
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "4444:3306" # host 4444 -> container 3306
    volumes:
      # DB datadir on a host bind-mount OUTSIDE the repo (real NTFS), so the
      # database survives not just Docker teardown but also uninstalling Docker
      # entirely -- unlike a Docker-managed named volume, which lives inside the
      # WSL2 VM and is destroyed with it. See scripts/backup-db.ps1 for the
      # logical (.sql) dumps that back this up.
      - ${LADYBUG_DATA_ROOT:-C:/docker_permanent}/ladybug-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./docker/php
    image: ladybug-php
    working_dir: /app
    # Seed .env on first run, ensure an app key exists, then serve the API.
    command: >
      sh -c "[ -f .env ] || cp .env.example .env;
             grep -q '^APP_KEY=base64:' .env || php artisan key:generate;
             php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      # DB config intentionally lives in backend/.env (mysql -> trashdb), NOT
      # here. Injecting DB_* as real container env vars overrode phpunit.xml's
      # SQLite test config (real env wins over <env> even with force="true"), so
      # `php artisan test` ran RefreshDatabase against the live dev database and
      # wiped it. Keeping DB_* out of the process env lets tests use SQLite
      # :memory: like CI, while the dev server reads MySQL from .env.
      # File-backed drivers keep the dev server working without running migrations.
      SESSION_DRIVER: file
      CACHE_STORE: file
    volumes:
      - ./backend:/app
      # Persist ALL Laravel storage (incl. the ~1.3 GB media library under
      # app/public) in a physical folder OUTSIDE the repo, so it survives not
      # just Docker teardown but also `git clean` / deleting the project dir.
      # This nested mount shadows the repo's storage skeleton inside /app.
      - ${LADYBUG_DATA_ROOT:-C:/docker_permanent}/ladybug-storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: node:20
    working_dir: /app
    # Anonymous volume below keeps the host's (Windows) node_modules out of the
    # Linux container; install fresh, then serve Vite on all interfaces.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
